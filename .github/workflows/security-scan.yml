# =============================================================================
# GitHub Actions iş akışı (workflow)
# Her push ve pull request iki iş çalıştırır:
#   1. security_scan     — app/ ve scan.py. Bulgu varsa kırmızı.
#   2. fixture_detection — yalnızca test_vuln.py. SQL Injection bulunursa yeşil.
# İkinci iş birincinin bitmesini bekler. İkisi aynı anda Groq'a giderse
# dakikalık token limiti dolup 429 üretir.
# =============================================================================

# name: GitHub arayüzünde (Actions sekmesinde) görünen iş akışı başlığıdır.
name: DevSecOps Güvenlik Taraması

# on: Bu iş akışının NE ZAMAN çalışacağını belirler.
# Aşağıdaki iki olaydan herhangi biri olduğunda tarama başlar.
on:
  # push: Herhangi bir dala kod gönderildiğinde (git push) tetiklenir.
  push:
  # pull_request: Bir pull request açıldığında veya güncellendiğinde tetiklenir.
  pull_request:

# contents: kodu okur. security-events: SARIF'i Code Scanning'e yazar.
# pull-requests: tarama özetini PR yorumu olarak ekler veya günceller.
# Gizli anahtarlar yine secrets ile gelir.
permissions:
  contents: read
  security-events: write
  pull-requests: write

# jobs: İş akışındaki işleri (job) listeler. Bir iş, bir sanal makinede
# sırayla çalışan adımlar bütünüdür.
jobs:
  # security_scan: Bu işin benzersiz kimliğidir. Loglarda bu isimle görünür.
  security_scan:
    name: Uygulama kodu taraması
    # runs-on: İşin hangi işletim sisteminde çalışacağını seçer.
    # ubuntu-latest 2026'da Ubuntu 26'ya geçti; Python 3.10/3.11 indirmesi
    # 504 hatası verebiliyor. 24.04 sabittir ve tool cache'inde Python vardır.
    runs-on: ubuntu-24.04

    # steps: Bu işin içinde sırayla çalışacak komut / eylem listesidir.
    # Adımlar yukarıdan aşağıya, bir önceki başarılı olduktan sonra çalışır.
    steps:
      # 1. Adım: Depodaki kodları sanal makineye indirir.
      # v7, Node 24 runtime kullanır (Node 20 GitHub'da kullanımdan kalktı).
      - name: Kodları Çek
        uses: actions/checkout@v7

      # 2. Adım: Python'u kurar ve PATH'e ekler.
      # Python 3.10 Ekim 2026'da EOL oldu; Dockerfile ile aynı 3.11 kullanılır.
      # v7, manifest indirmede 504 gibi geçici hatalara karşı yeniden dener.
      - name: Python Ortamını Kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # 3. Adım: requirements.txt içindeki Python paketlerini yükler.
      # run: sanal makinenin terminalinde çalıştırılacak komuttur.
      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      # 4. Adım: Yerel tarama scriptini CI ortamında çalıştırır.
      # env: Bu adıma özel ortam değişkenleridir.
      # secrets.GROQ_API_KEY, GitHub deposundaki gizli değişkenden gelir.
      # Anahtar asla YAML içine yazılmaz; Actions loglarında da gizlenir.
      # GITHUB_TOKEN, PR yorumu için Actions'ın ürettiği kısa ömürlü tokendir.
      # python scan.py uygulama koduna bakar. test_vuln.py bu adımda yoktur.
      # --export-sarif, Security sekmesi için results.sarif üretir.
      # --comment-pr, pull_request olayında özet yorum yazar.
      - name: Güvenlik Taramasını Çalıştır
        run: python scan.py --export-sarif results.sarif --comment-pr
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tarama kırmızı olsa bile (çıkış 1) SARIF yüklenir; Security sekmesi
      # bulguları görsün. Dosya yoksa (çıkış 2, taramadan önce kırılma) atlanır.
      # Fixture işi kasıtlı SQL Injection içerir; bu yüzden SARIF yüklemez.
      - name: SARIF yükle
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  # Kasıtlı SQL Injection örneği. Bulgu bu işin başarı koşuludur.
  fixture_detection:
    name: SQL Injection örneği yakalanıyor
    needs: security_scan
    runs-on: ubuntu-24.04
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v7

      - name: Python Ortamını Kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      - name: Kasıtlı SQL Injection örneğini tara
        run: python scan.py --fixture
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
