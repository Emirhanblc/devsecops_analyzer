services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000" # Dışarıdan 8080 portuyla erişeceğiz, içeride 8000'e yönlenecek
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Geliştirme sırasında yalnızca gerekli klasörleri konteynere bağlıyoruz.
      - ./app:/app/app
      - ./temp_repos:/app/temp_repos
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: secuser
      POSTGRES_PASSWORD: secpass123
      POSTGRES_DB: secdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secuser -d secdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: